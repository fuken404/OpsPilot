name: Barrido de SLA

# En Vercel la API se apaga cuando no hay tráfico y el cron gratuito solo corre una vez al día,
# así que el barrido lo dispara GitHub Actions cada 5 minutos (el mínimo que permite).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Hasta publicar la API (fase 6) no hay a quién llamar.
    if: vars.OPSPILOT_API_URL != ''
    timeout-minutes: 3
    steps:
      - name: Barrer relojes
        env:
          API_URL: ${{ vars.OPSPILOT_API_URL }}
          SWEEP_TOKEN: ${{ secrets.SLA_SWEEP_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
            -X POST "$API_URL/api/internal/sla/sweep" -H "X-Sweep-Token: $SWEEP_TOKEN"
