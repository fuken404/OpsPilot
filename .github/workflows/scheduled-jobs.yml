name: Tareas programadas

# En Vercel la API se apaga cuando no hay tráfico y el cron gratuito solo corre una vez al día,
# así que GitHub Actions la llama cada 5 minutos (el mínimo que permite): barre los SLA y envía
# los correos pendientes de la bandeja de salida.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    # Hasta publicar la API (fase 6) no hay a quién llamar.
    if: vars.OPSPILOT_API_URL != ''
    timeout-minutes: 4
    env:
      API_URL: ${{ vars.OPSPILOT_API_URL }}
      TOKEN: ${{ secrets.INTERNAL_JOBS_TOKEN }}
    steps:
      - name: Barrer relojes de SLA
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
            -X POST "$API_URL/api/internal/sla/sweep" -H "X-Internal-Token: $TOKEN"
      - name: Enviar correos pendientes
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
            -X POST "$API_URL/api/internal/mail/dispatch" -H "X-Internal-Token: $TOKEN"
