server:
  port: ${PORT:8081}

spring:
  application:
    name: opspilot
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5436/opspilot}
    username: ${DATABASE_USERNAME:opspilot}
    password: ${DATABASE_PASSWORD:opspilot}
    hikari:
      # Cada conexión de la app actúa como opspilot_app: Row Level Security se aplica siempre.
      connection-init-sql: set role opspilot_app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    # Flyway abre su propia conexión con el usuario dueño, sin el cambio de rol de la app.
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  servlet:
    multipart:
      # Vercel limita el cuerpo de una petición a 4.5 MB: los adjuntos se quedan por debajo.
      max-file-size: 4MB
      max-request-size: 5MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  modulith:
    events:
      jdbc:
        # La tabla de eventos la crea Flyway (V2); la app no tiene permiso para crear tablas.
        schema-initialization:
          enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/opspilot}

opspilot:
  security:
    # El token debe ir dirigido a esta API: un token emitido para otra aplicación del mismo realm no sirve.
    audience: ${OIDC_AUDIENCE:opspilot-api}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
  sla:
    zone: ${SLA_ZONE:America/Bogota}
    opens: "08:00"
    closes: "18:00"
    scheduler-enabled: false
    sweep-interval: PT1M
  # Secreto de los endpoints que llama el cron (barrido de SLA y envío de correos). Vacío: no existen.
  internal-token: ${INTERNAL_JOBS_TOKEN:}
  app-url: ${APP_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:OpsPilot <no-reply@opspilot.local>}
    dispatcher-enabled: false
  attachments:
    max-bytes: 4194304
    local-dir: ${ATTACHMENTS_DIR:${user.home}/.opspilot/attachments}
  realtime:
    # memory: una sola instancia. redis: varias instancias comparten los eventos por pub/sub.
    broker: ${REALTIME_BROKER:memory}

management:
  health:
    redis:
      # El tiempo real no es crítico: si Redis cae, la API sigue sana.
      enabled: false
    mail:
      # Los correos esperan en la bandeja de salida: un SMTP caído no tumba la API.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui
