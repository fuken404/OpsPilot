# Producción en una sola máquina (Oracle Cloud Always Free, ARM).
# Caddy pone HTTPS automático; el resto de servicios no se publica en internet.
name: opspilot

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_HOST: ${API_HOST}
      AUTH_HOST: ${AUTH_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - keycloak

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "opspilot"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # Solo pasa mensajes en vivo: no necesita guardar nada en disco.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]

  keycloak:
    image: ghcr.io/fuken404/opspilot-keycloak:${TAG:-latest}
    restart: unless-stopped
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: opspilot
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: https://${AUTH_HOST}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # La consola de administración solo se abre por un túnel SSH (http://localhost:8080/admin).
      KC_HOSTNAME_ADMIN: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/opspilot-realm.json:ro
    mem_limit: 1536m
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/fuken404/opspilot-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DATABASE_URL: jdbc:postgresql://postgres:5432/opspilot
      DATABASE_USERNAME: opspilot
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      OIDC_ISSUER_URI: https://${AUTH_HOST}/realms/opspilot
      ALLOWED_ORIGINS: ${APP_URL}
      APP_URL: ${APP_URL}
      REDIS_URL: redis://valkey:6379
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: OpsPilot <no-reply@opspilot.fuken404.dev>
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    # La API valida tokens contra Keycloak por su dominio público; así no sale a internet y vuelve.
    extra_hosts:
      - "${AUTH_HOST}:host-gateway"
    volumes:
      - attachments:/data/attachments
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy

  # Las cuentas de demostración usan un dominio inventado: los correos se quedan aquí (se ven por túnel SSH).
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    mem_limit: 128m

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups
      - attachments:/attachments:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  attachments:
  backups:
